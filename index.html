.sp-marks{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.sp-mk{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .6rem;border-radius:999px;background:rgba(255,255,255,.85);color:var(--on-pastel);font:600 .78rem var(--f-ui);font-variant-numeric:tabular-nums}
.sp-mk i{width:.75rem;height:.75rem;border-radius:50%;border:1.5px solid var(--on-pastel)}
.sp-mk.g i{background:var(--go)} .sp-mk.y i{background:var(--wait)} .sp-mk.r i{background:var(--stop)}
.sp-ctrl{display:grid;gap:.5rem}
.sp-ctrl .row{justify-content:center}
.sp-log{max-height:7.5rem;overflow:auto;display:grid;gap:.25rem;font-size:.85rem}
.sp-log div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.6rem;align-items:center;padding:.3rem .6rem;border-radius:.6rem;background:var(--card-2)}
.sp-log span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-log b{font-variant-numeric:tabular-nums}
.sp-log em{font-style:normal;font-weight:600;font-size:.75rem;padding:.1rem .5rem;border-radius:999px}
.sp-log em.ok{background:var(--mint);color:var(--on-pastel)} .sp-log em.no{background:var(--pink);color:var(--on-pastel)}
.sp-cust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.sp-cust.off{display:none}

/* ---------- Calculator ---------- */
.cl{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:.6rem;outline:none;border-radius:1rem}
.cl:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cl-disp{display:grid;justify-items:end;gap:.15rem;padding:.6rem .8rem;border-radius:1rem;background:var(--card-2);min-width:0;overflow:hidden}
.cl-hist{display:grid;justify-items:end;font:400 .72rem/1.3 var(--f-ui);color:var(--ink-soft);max-height:2.8rem;overflow:hidden}
.cl-expr{font:600 min(2.4rem,11cqw)/1.15 var(--f-display);font-variant-numeric:tabular-nums;max-width:100%;overflow-x:auto;white-space:nowrap;direction:ltr}
.cl-res{font:500 1rem/1.2 var(--f-ui);color:var(--ink-soft);min-height:1.2em;font-variant-numeric:tabular-nums}
.cl-keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:.4rem;min-height:0}
.cl-k{border:2px solid var(--edge);border-radius:.9rem;background:var(--card);color:var(--ink);font:600 min(1.6rem,7cqw) var(--f-display);min-height:0;padding:0}
.cl-k:active{transform:scale(.95)}
.cl-k.op{background:var(--lav);color:var(--on-pastel)} .cl-k.fn{background:var(--card-2)} .cl-k.eq{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* ---------- Tongue twisters ---------- */
.tt{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:.55rem}
.tt-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tt-top .sp{flex:1}
.tt-snd{width:auto;min-height:2.1rem;padding:.2rem .6rem;font-size:.82rem}
.tt-card{min-height:0;overflow:auto;display:grid;place-items:center;padding:.8rem 1rem;border-radius:1.2rem;background:var(--butter);color:var(--on-pastel);border:2px solid var(--edge);font:600 max(1.1rem,var(--fs,7cqw))/1.2 var(--f-display);text-align:center;text-wrap:balance}
.tt-card p{margin:0}
.tt-card mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--stop);text-decoration-thickness:.12em;text-underline-offset:.12em}
.tt-say{margin:0;text-align:center;color:var(--ink-soft);font-size:.85rem}
.tt-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tt-bar .sp{flex:1}
.tt-time{font:600 1.6rem var(--f-display);font-variant-numeric:tabular-nums;min-width:4.5rem}
.tt-time.run{color:var(--stop)}
.tt-best{font:500 .85rem var(--f-ui);color:var(--ink-soft)}

/* ---------- Word family ---------- */
.wf,.dc{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:.5rem;min-height:0}
.dc{grid-template-rows:auto auto minmax(0,1fr)}
.wf-search{display:flex;gap:.5rem}
.wf-search .inp{flex:1;font-size:1.05rem}
.wf-recent .chip{min-height:1.8rem}
.wf-msg{margin:0;color:var(--ink-soft);font-size:.9rem}
.wf-msg:empty{display:none}
.wf-area{min-height:0;overflow:auto;display:grid;align-content:start;gap:.6rem}
.wf-tree{display:grid;justify-items:center;padding-top:.2rem}
.wf-root{position:relative;display:grid;justify-items:center;gap:.1rem;padding-bottom:1.1rem}
.wf-root::after{content:"";position:absolute;bottom:0;left:50%;height:1.1rem;border-left:2px solid var(--edge)}
.wf-base{padding:.5rem 1.4rem;border-radius:1rem;border:2.5px solid var(--edge);background:var(--butter);color:var(--on-pastel);font:600 min(2.2rem,7cqw)/1.1 var(--f-display)}
.wf-root small{position:absolute;top:100%;margin-top:-1.05rem;left:calc(50% + .4rem);font:500 .7rem var(--f-ui);color:var(--ink-soft);white-space:nowrap}
.wf-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;width:100%}
.wf-col{position:relative;display:grid;align-content:start;gap:.4rem;padding-top:1.1rem;min-width:0}
.wf-col::before{content:"";position:absolute;top:0;left:50%;height:1.1rem;border-left:2px solid var(--edge)}
.wf-col::after{content:"";position:absolute;top:0;left:-.3rem;right:-.3rem;border-top:2px solid var(--edge)}
.wf-col:first-child::after{left:50%} .wf-col:last-child::after{right:50%}
.wf-pos{display:grid;justify-items:center;padding:.35rem .4rem;border-radius:.8rem;border:2px solid var(--edge);background:var(--pc);color:var(--on-pastel)}
.wf-pos b{font:600 min(1.05rem,3.4cqw)/1.15 var(--f-display)}
.wf-pos span{font:600 .8rem/1.2 "Tajawal",var(--f-ui)}
.wf-words{display:grid;gap:.3rem}
.wf-w{display:flex;align-items:center;border-radius:.7rem;border:2px solid var(--pc);background:var(--card);min-width:0}
.wf-w.typed{background:var(--pc);border-color:var(--edge)}
.wf-w.neg{border-style:dashed}
.wf-say{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:500 min(1rem,3.2cqw)/1.2 var(--f-ui);padding:.4rem .5rem;text-align:center;overflow-wrap:anywhere}
.wf-w.typed .wf-say{color:var(--on-pastel);font-weight:600}
.wf-x{border:0;background:none;color:var(--ink-soft);font-size:1.1rem;padding:0 .45rem}
.wf-none{text-align:center;color:var(--ink-soft)}
.wf-add .inp{min-height:2.1rem;padding:.25rem .55rem;font-size:.85rem;text-align:center}
.wf-foot{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.wf-foot .sp{flex:1}
.wf-key{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--ink-soft)}
.wf-key i{width:1.4rem;height:.9rem;border:2px dashed var(--ink-soft);border-radius:.3rem}
@container (max-width: 30rem){
  .wf-cols{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:.9rem}
  .wf-col{padding-top:0}
  .wf-col::before,.wf-col::after,.wf-root::after,.wf-root small{display:none}
  .wf-root{padding-bottom:.2rem}
}

/* ---------- Dictionary ---------- */
.dc-out{min-height:0;overflow:auto;display:grid;align-content:start;gap:.75rem;padding-right:.15rem}
.dc-msg{margin:0;color:var(--ink-soft)}
.dc-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;align-items:start}
.dc-hw{display:grid;gap:.35rem;justify-items:start;min-width:0}
.dc-word{font:600 min(2.6rem,9cqw)/1.05 var(--f-display);overflow-wrap:anywhere}
.dc-ipa{font:400 1.05rem/1.2 "Segoe UI","Lexend",system-ui,sans-serif;color:var(--ink-soft)}
.dc-say{display:flex;gap:.4rem;flex-wrap:wrap}
.dc-pos{display:inline-flex;padding:.15rem .55rem;border-radius:999px;background:var(--lav);color:var(--on-pastel);font:600 .75rem var(--f-ui)}
.dc-pic{width:min(9rem,28cqw);aspect-ratio:1;border-radius:1rem;border:2px solid var(--edge);background:#fff;display:grid;place-items:center;overflow:hidden}
.dc-pic img{width:100%;height:100%;object-fit:cover}
.dc-pic svg{width:86%;height:86%}
.dc-sec{display:grid;gap:.3rem;padding:.6rem .8rem;border-radius:1rem;background:var(--card-2);min-width:0}
.dc-sec h4{margin:0;font:600 .7rem/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.dc-sec p,.dc-sec ol{margin:0}
.dc-sec ol{padding-left:1.2rem;display:grid;gap:.25rem}
.dc-sec li em{font-style:normal;font-size:.75rem;color:var(--ink-soft)}
.dc-ar{background:var(--butter);color:var(--on-pastel)}
.dc-ar h4{color:var(--on-pastel);opacity:.7}
.dc-ar p{font:700 min(1.9rem,6.5cqw)/1.3 "Tajawal",var(--f-ui);text-align:right}
.dc-ex{position:relative;padding-right:3rem}
.dc-ex .en{font:500 1.05rem/1.45 var(--f-ui)}
.dc-ex .en mark{background:var(--butter);color:var(--on-pastel);border-radius:.25rem;padding:0 .15rem}
.dc-ex .ar{font:500 1rem/1.5 "Tajawal",var(--f-ui);color:var(--ink-soft);text-align:right}
.dc-ex > .btn{position:absolute;top:.5rem;right:.5rem}
.dc-foot{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.dc-foot .sp{flex:1}

/* ---------- Brainstorm maps ---------- */
.mm,.ex{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.5rem;min-height:0}
.mm.lvon{grid-template-rows:auto auto minmax(0,1fr) auto}
.mm.lvbig{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "lv stage" "lv add"}
.mm.lvbig > .mm-bar{grid-area:bar} .mm.lvbig > .lv{grid-area:lv} .mm.lvbig > .mm-stage{grid-area:stage} .mm.lvbig > .mm-add{grid-area:add}
.mm .lv.big,.ex .lv.big{flex-direction:column;justify-content:center;align-items:stretch;text-align:center}
.mm .lv.big .lv-qr,.ex .lv.big .lv-qr{width:max(7rem,min(30cqw,calc(100cqh - 13rem)));margin:0 auto}
.mm .lv.big .lv-side,.ex .lv.big .lv-side{flex:none;align-items:center}
.mm .lv.big .lv-btns,.ex .lv.big .lv-btns{justify-content:center}
.mm-bar,.ex-bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.mm-bar .sp,.ex-bar .sp{flex:1}
.mm-vl{font:600 .7rem var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.mm-view{width:auto;min-height:2.1rem;padding:.2rem .6rem;font-size:.85rem}
.mm-dot{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--edge);flex:none}
.mm-stage{position:relative;min-height:0;overflow:auto;border-radius:1rem;background:var(--card-2)}
.mm-stage.mind{overflow:hidden}
.mm-lines,.mm-lines svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mm-lines path{fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linecap:round}
.mm-lines path.br{stroke-width:5}
.mm-topic,.mm-br,.mm-stage.mind .mm-item{position:absolute;transform:translate(-50%,-50%);text-align:center}
.mm-topic{max-width:30%;padding:.6rem 1.1rem;border-radius:1.4rem;border:3px solid var(--edge);background:var(--butter);color:var(--on-pastel);font:600 clamp(1rem,3.3cqw,2rem)/1.15 var(--f-display);z-index:3;outline:none;text-wrap:balance}
.mm-br{max-width:22%;padding:.4rem .8rem;border-radius:1rem;border:2.5px solid var(--edge);background:var(--bc);color:var(--on-pastel);font:600 clamp(.85rem,2.3cqw,1.35rem)/1.15 var(--f-display);z-index:2;outline:none}
.mm-item{display:grid;gap:.1rem;max-width:19%;padding:.3rem .55rem;border-radius:.8rem;border:2px solid var(--bc);background:var(--card);color:var(--ink);font:500 clamp(.72rem,1.75cqw,1.05rem)/1.25 var(--f-ui);z-index:1;cursor:pointer;overflow-wrap:anywhere;box-shadow:var(--shadow-sm)}
.mm-item small{font-size:.7em;color:var(--ink-soft)}
.mm-item.sel{outline:3px solid var(--focus);outline-offset:1px;z-index:4}
.mm-item.live{animation:winpop .45s}
.mm-x{position:absolute;top:-.7rem;right:-.7rem;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--edge);background:var(--stop);color:#fff;font:700 1rem/1 var(--f-ui);padding:0;display:grid;place-items:center}
.mm-stage:not(.mind) .mm-item{position:relative;max-width:none;text-align:left}
.mm-topic:focus,.mm-br:focus,.mt-h:focus,.mc-h:focus,.mc-title:focus,.mt-root b:focus,.mv-h:focus{box-shadow:0 0 0 3px var(--focus)}
.mm-add{display:flex;gap:.5rem;align-items:center}
.mm-add select{width:auto;max-width:35%;min-height:2.3rem}
.mm-add .inp{flex:1;min-height:2.3rem}
.mt{display:grid;justify-items:center;padding:.8rem .6rem;min-width:min-content}
.mt-root{position:relative;padding-bottom:1.1rem}
.mt-root::after{content:"";position:absolute;bottom:0;left:50%;height:1.1rem;border-left:2px solid var(--edge)}
.mt-root b{display:block;padding:.5rem 1.2rem;border-radius:1rem;border:2.5px solid var(--edge);background:var(--butter);color:var(--on-pastel);font:600 min(1.7rem,5cqw)/1.15 var(--f-display);outline:none}
.mt-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(8rem,1fr));gap:.6rem;width:100%}
.mt-col{position:relative;display:grid;align-content:start;gap:.4rem;padding-top:1.1rem;min-width:0}
.mt-col::before{content:"";position:absolute;top:0;left:50%;height:1.1rem;border-left:2px solid var(--edge)}
.mt-col::after{content:"";position:absolute;top:0;left:-.3rem;right:-.3rem;border-top:2px solid var(--edge)}
.mt-col:first-child::after{left:50%} .mt-col:last-child::after{right:50%}
.mt-col:only-child::after{display:none}
.mt-h,.mc-h{padding:.4rem .6rem;border-radius:.8rem;border:2px solid var(--edge);background:var(--bc);color:var(--on-pastel);font:600 min(1.15rem,3.6cqw)/1.2 var(--f-display);text-align:center;outline:none}
.mt-items,.mc-items{display:grid;gap:.35rem}
.mc{display:grid;gap:.6rem;padding:.6rem;align-content:start;min-width:min-content}
.mc-title{justify-self:center;font:600 min(1.7rem,5cqw)/1.15 var(--f-display);outline:none;padding:0 .3rem;border-radius:.4rem}
.mc-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(8rem,1fr));gap:.7rem;align-items:start}
.mc-col{display:grid;gap:.45rem;align-content:start;min-width:0}
.mc.flow .mc-cols{gap:1.8rem}
.mc.flow .mc-col{position:relative}
.mc.flow .mc-col:not(:last-child) .mc-h::after{content:"";position:absolute;top:1.05rem;right:-1.55rem;width:1.3rem;height:.9rem;background:var(--ink);clip-path:polygon(0 35%,60% 35%,60% 0,100% 50%,60% 100%,60% 65%,0 65%)}
.mv{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.4rem;height:100%;padding:.5rem}
.mv-area{position:relative;min-height:16rem;display:grid;grid-template-columns:1fr .8fr 1fr;align-items:start;gap:.4rem;padding:12% 3% 4%}
.mv-c{position:absolute;top:2%;bottom:2%;width:58%;border-radius:50%;border:3px solid var(--edge);opacity:.55}
.mv-c.a{left:2%;background:var(--lav)} .mv-c.b{right:2%;background:var(--mint)}
.mv-zone{position:relative;z-index:1;display:grid;gap:.35rem;align-content:start;min-width:0}
.mv-h{justify-self:center;padding:.25rem .7rem;border-radius:999px;background:var(--card);border:2px solid var(--edge);font:600 min(1.1rem,3.4cqw)/1.2 var(--f-display);outline:none;text-align:center}
.mv-items{display:grid;gap:.3rem}
.mv .mm-item{font-size:clamp(.7rem,1.6cqw,.95rem)}
@container (max-width: 34rem){
  .mm.lvbig,.ex.lvbig{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"bar" "lv" "stage" "add"}
  .mm .lv.big,.ex .lv.big{flex-direction:row;text-align:left}
  .mm .lv.big .lv-qr,.ex .lv.big .lv-qr{width:max(6rem,min(40%,calc(100cqh - 18rem)));margin:0}
}

/* ---------- Exit ticket ---------- */
.ex{grid-template-rows:auto auto minmax(0,1fr)}
.ex.lvon{grid-template-rows:auto auto auto minmax(0,1fr)}
.ex.lvbig{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"bar bar" "lv sum" "lv list"}
.ex.lvbig > .ex-bar{grid-area:bar} .ex.lvbig > .lv{grid-area:lv} .ex.lvbig > .ex-sum{grid-area:sum} .ex.lvbig > .ex-list{grid-area:list}
.ex-n{font:600 1.1rem var(--f-display)}
.ex-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}
.ex-m{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.35rem;padding:.3rem .5rem;border-radius:.8rem;background:var(--card-2);overflow:hidden}
.ex-m .face{width:1.7rem;height:1.7rem;position:relative;z-index:1}
.ex-m .face svg{width:100%;height:100%}
.ex-ml{position:relative;z-index:1;font-size:.75rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-m i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--lav);opacity:.45;transition:width .4s}
.ex-m b{position:relative;z-index:1;font:600 1.05rem var(--f-display);font-variant-numeric:tabular-nums}
.ex-list{min-height:0;overflow:auto;columns:15rem;column-gap:.55rem}
.ex-list > .empty{height:auto;min-height:100%;column-span:all}
.ex-qs{margin:.2rem 0 0;padding-left:1.2rem;text-align:left;color:var(--ink-soft);font-size:.85rem}
.ex-card{break-inside:avoid;margin:0 0 .55rem;display:grid;gap:.45rem;padding:.6rem .7rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card)}
.ex-card header{display:flex;align-items:center;gap:.45rem}
.ex-card header .face{width:1.8rem;height:1.8rem}
.ex-card header .face svg{width:100%;height:100%}
.ex-card header b{font:600 1rem var(--f-display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-card header .sp{flex:1}
.ex-card .ib{width:1.8rem;height:1.8rem}
.ex-a{display:grid;gap:.1rem}
.ex-a small{font-size:.72rem;color:var(--ink-soft)}
.ex-a p{margin:0;font:500 .95rem/1.4 var(--f-ui);white-space:pre-wrap;overflow-wrap:anywhere}
@container (max-width: 30rem){ .ex-sum{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- Students' page: brainstorm and exit ticket ---------- */
.jn-br{display:flex;flex-wrap:wrap;gap:.45rem}
.jn-b{min-height:2.6rem;padding:.35rem .9rem;border-radius:999px;border:2px solid var(--edge);background:var(--card);color:var(--ink);font:500 .98rem var(--f-ui)}
.jn-b[aria-pressed="true"]{background:var(--bc);color:var(--on-pastel);font-weight:600;box-shadow:0 0 0 3px var(--focus)}
.jn-faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.45rem}
.jn-face{display:grid;justify-items:center;gap:.2rem;padding:.5rem .2rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card);color:var(--ink)}
.jn-face .face{width:2.8rem;height:2.8rem}
.jn-face .face svg{width:100%;height:100%}
.jn-face small{font-size:.75rem}
.jn-face[aria-pressed="true"]{background:var(--butter);color:var(--on-pastel);box-shadow:0 0 0 3px var(--focus)}

/* ---------- Save the board ---------- */
.cap-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.7rem}
.cap-opt{display:grid;justify-items:start;gap:.3rem;padding:1rem;border-radius:1rem;border:2px solid var(--edge);background:var(--card);color:var(--ink);text-align:left}
.cap-opt svg{width:2.4rem;height:2.4rem}
.cap-opt b{font:600 1.15rem var(--f-display)}
.cap-opt span{font-size:.82rem;color:var(--ink-soft)}
.cap-opt:hover{background:var(--card-2)}

</style>

<script>
(function(){'use strict';

function numIn(id, v, max) {

}
function runClock(s) {
  // shared countdown state: dur (s), left (s), end (ms timestamp when running), done
  return {
    rem: () => s.end ? Math.max(0, (s.end - now()) / 1000) : s.left,
    start() { if (s.left <= 0) s.left = s.dur; s.end = now() + s.left * 1000; s.done = false; save(); },
    pause() { s.left = this.rem(); s.end = null; save(); },
    reset() { s.left = s.dur; s.end = null; s.done = false; save(); },
    set(sec) { s.dur = s.left = Math.max(1, Math.round(sec)); s.end = null; s.done = false; save(); },
    add(sec) { if (s.end) s.end += sec * 1000; else s.left = Math.max(0, s.left + sec); s.dur = Math.max(s.dur + sec, 1); s.done = false; save(); },
  };
}
function finishCheck(c, clock, onDone) {
  const s = c.s;
  if (s.end && clock.rem() <= 0) { s.end = null; s.left = 0; s.done = true; save(); if (s.snd !== 'none') Snd.play(s.snd || 'bell'); onDone && onDone(); }
  c.el.classList.toggle('alarm', !!s.done);
}

const FONTS = [['lexend', 'Clear', 'var(--f-ui)'], ['andika', 'Early reader', '"Andika","Tajawal",system-ui,sans-serif'], ['fredoka', 'Rounded', 'var(--f-display)'], ['caveat', 'Handwriting', '"Caveat","Tajawal",cursive']];
function cleanHtml(html) {
  const doc = new DOMParser().parseFromString('<div>' + String(html) + '</div>', 'text/html');
  const OK = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'DIV', 'P', 'SPAN', 'FONT', 'UL', 'OL', 'LI']);
  const walk = n => {
    [...n.children].forEach(el => {
      if (!OK.has(el.tagName)) { el.replaceWith(...el.childNodes); return walk(n); }
      const col = el.getAttribute('color') || el.style.color;
      [...el.attributes].forEach(a => el.removeAttribute(a.name));
      if (col && /^(#[0-9a-f]{3,8}|rgb\([\d,\s.]+\)|[a-z]+)$/i.test(col)) el.style.color = col;
      walk(el);
    });
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}

    h('button', { class: 'ib', id: 'bnext', type: 'button', title: 'Next board', 'aria-label': 'Next board', onclick: () => stepBoard(1) }, svg('right')),
    ib('download', 'Save the board as a picture or PDF', openExport), ib('dockhide', 'Hide the tool bar', () => setDock(false)), ib('fs', 'Full screen', goFull)));
  dockEl = h('nav', { id: 'dock', 'aria-label': 'Tools' }, DOCK.map(d => d === '|' ? h('i', { class: 'dsep', 'aria-hidden': 'true' }) :
    h('button', { class: 'tool', type: 'button', title: d[1], onclick: () => DOCK_ACT[d[0]] ? DOCK_ACT[d[0]]() : addWidget(d[0]) }, svg((T[d[0]] && T[d[0]].icon) || d[0]), h('span', {}, d[1]))));
  dockEl.prepend(h('button', { class: 'dock-arrow l', type: 'button', 'aria-label': 'More tools to the left', onclick: () => dockEl.scrollBy({ left: -dockEl.clientWidth * .6, behavior: 'smooth' }) }, svg('left')));
  dockEl.append(h('button', { class: 'dock-arrow r', type: 'button', 'aria-label': 'More tools to the right', onclick: () => dockEl.scrollBy({ left: dockEl.clientWidth * .6, behavior: 'smooth' }) }, svg('right')));
  const dockOvf = () => { const o = dockEl.scrollWidth > dockEl.clientWidth + 4; dockEl.classList.toggle('ovf', o); dockEl.classList.toggle('at-start', dockEl.scrollLeft < 8); dockEl.classList.toggle('at-end', dockEl.scrollLeft + dockEl.clientWidth > dockEl.scrollWidth - 8); };
  dockEl.addEventListener('scroll', dockOvf, { passive: true }); addEventListener('resize', dockOvf); setTimeout(dockOvf, 50);
  dockEl.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { dockEl.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
  const tab = h('button', { id: 'dockTab', type: 'button', hidden: true, onclick: () => setDock(true) }, svg('up'), 'Tools');
  app.append(bgEl, boardEl, stkEl, left, right, dockEl, tab, toastEl);
  root.append(app);
}
function setDock(on) { S.dock = on; save(); dockEl.classList.toggle('hide', !on); $('#dockTab').hidden = on; }

function wireEvents() {
  let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(relayout, 80); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (palEl) { closePal(); return; }
    if (sheetWrap) { closeSheet(); return; }
    live.forEach(r => { if (r.el.classList.contains('max')) toggleMax(r); });
  });
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.stk')) document.querySelectorAll('.stk.sel').forEach(x => x.classList.remove('sel'));
  }, true);
  document.addEventListener('pointerdown', function unlock() { Snd.ctx(); document.removeEventListener('pointerdown', unlock); });
  document.addEventListener('visibilitychange', wake);
  // drop files onto the board
  app.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  app.addEventListener('drop', e => {
    const files = e.dataTransfer && e.dataTransfer.files; if (!files || !files.length) return;
    e.preventDefault(); [...files].slice(0, 6).forEach((f, i) => addFile(f, { x: e.clientX + i * 30, y: e.clientY + i * 30 }));
  });
  // paste pictures, links or text onto the board
  document.addEventListener('paste', e => {
    const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    const cd = e.clipboardData; if (!cd) return;
    const file = [...(cd.files || [])][0];
    if (file) { e.preventDefault(); addFile(file); return; }
    const text = (cd.getData('text/plain') || '').trim(); if (!text) return;
    e.preventDefault();
    if (isUrl(text)) { const u = normUrl(text); ytId(u) ? addWidget('video', { yt: ytId(u) }) : addWidget('link', { url: u, label: hostOf(u) }); }
    else addWidget('text', { html: text.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])).replace(/\n/g, '<br>') });
  });
}

function start() {
  S = load();
  applyPrefs();
  const qs = new URLSearchParams(location.search);
  if (qs.has('join')) { document.documentElement.classList.add('joining'); startJoin(qs); return; }
  buildShell(document.getElementById('vocaboard') || document.body);
  setDock(S.dock !== false);
  boardEl.classList.toggle('stack', isStack());
  if (S.first) seedExample();
  showBoard();
  wireEvents();
  wake();
  setInterval(() => { for (const f of tickers) { try { f(); } catch (e) { console.error(e); } } }, 100);
  if (APP && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

})();
