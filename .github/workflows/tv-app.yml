      - name: Build the APK
        run: |
          set -euo pipefail
          cd tvapp
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          install_sdk() { set +o pipefail; yes | "$SDKM" "$1" > /dev/null; set -o pipefail; }
          JAR=""
          for v in 35 36 34; do
            if [ -f "$SDK/platforms/android-$v/android.jar" ]; then JAR="$SDK/platforms/android-$v/android.jar"; break; fi
          done
          if [ -z "$JAR" ]; then install_sdk "platforms;android-35"; JAR="$SDK/platforms/android-35/android.jar"; fi
          BTV=$(ls -1 "$SDK/build-tools" 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$BTV" ]; then install_sdk "build-tools;35.0.0"; BTV=35.0.0; fi
          BT="$SDK/build-tools/$BTV"
          echo "Building with $JAR and build-tools $BTV"
          N="${GITHUB_RUN_NUMBER:-1}"
          rm -rf build out && mkdir -p build/flat build/gen build/obj build/dex out
          "$BT/aapt2" compile --no-crunch -o build/flat res/drawable-xhdpi/banner.png
          "$BT/aapt2" compile --no-crunch -o build/flat res/mipmap-xxxhdpi/ic_launcher.png
          "$BT/aapt2" link -o build/base.apk -I "$JAR" --manifest AndroidManifest.xml --java build/gen \
            --min-sdk-version 21 --target-sdk-version 34 --version-code "$N" --version-name "1.0.$N" build/flat/*.flat
          javac -source 8 -target 8 -bootclasspath "$JAR" -Xlint:-options -encoding UTF-8 -d build/obj $(find src build/gen -name '*.java')
          "$BT/d8" --release --min-api 21 --lib "$JAR" --output build/dex $(find build/obj -name '*.class')
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q -X ../unsigned.apk classes.dex)
          "$BT/zipalign" -p -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/key.jks -storepass vocaboard -keypass vocaboard -alias vocaboard \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VocaBoard, O=Ms. Amina Qatan" -noprompt
          "$BT/apksigner" sign --ks build/key.jks --ks-pass pass:vocaboard --key-pass pass:vocaboard --ks-key-alias vocaboard \
            --out out/VocaBoard-TV.apk build/aligned.apk
          "$BT/apksigner" verify --verbose out/VocaBoard-TV.apk
          ls -l out

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tv-app --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create tv-app --repo "$GITHUB_REPOSITORY" --title "VocaBoard TV app" --notes "VocaBoard for Sony / Google TV, Android TV, Android smart boards and tablets. Developed by: Ms. Amina Qatan. Download VocaBoard-TV.apk below."
          gh release upload tv-app tvapp/out/VocaBoard-TV.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "APK download link: https://github.com/$GITHUB_REPOSITORY/releases/download/tv-app/VocaBoard-TV.apk" >> "$GITHUB_STEP_SUMMARY"
