# VocaBoard TV app: builds an Android app (APK) for Sony / Google TV, Android TV, Android smart boards and tablets.
# Developed by: Ms. Amina Qatan
# It runs by itself when this file is added or changed, or from the Actions tab > "Build VocaBoard TV app" > Run workflow.
# The APK is then at: https://github.com/<you>/<repository>/releases/download/tv-app/VocaBoard-TV.apk
name: Build VocaBoard TV app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tv-app.yml'

permissions:
  contents: write

concurrency:
  group: tv-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the website files
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Write the app files
        run: |
          mkdir -p tvapp/src/com/aminaqatan/vocaboard tvapp/res/drawable-xhdpi tvapp/res/mipmap-xxxhdpi
          cat > tvapp/AndroidManifest.xml <<'END_OF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aminaqatan.vocaboard">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
              <application
                  android:label="VocaBoard"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_OF_MANIFEST
          cat > tvapp/src/com/aminaqatan/vocaboard/MainActivity.java <<'END_OF_JAVA'
          package com.aminaqatan.vocaboard;

          import android.app.Activity;
          import android.app.UiModeManager;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.ArrayList;

          /* VocaBoard for Android TV, smart boards and tablets. Developed by: Ms. Amina Qatan
             Opens the VocaBoard website full screen. The remote's Back button goes back inside VocaBoard
             (closing the open window) before it leaves the app. */
          public class MainActivity extends Activity {
              private static final String HOME = "https://aminaqatan.github.io/VocaBoard-App/";
              private static final String HOST = "aminaqatan.github.io";
              private static final int PICK_FILE = 42, ASK_PERMISSION = 7;
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingPermission;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  // "SmartTV" tells VocaBoard to switch on the TV remote mode
                  s.setUserAgentString(s.getUserAgentString() + (isTv() ? " SmartTV VocaBoardTV" : " VocaBoardApp"));

                  CookieManager cookies = CookieManager.getInstance();
                  cookies.setAcceptCookie(true);
                  cookies.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      @SuppressWarnings("deprecation")
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return openOutside(url);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), PICK_FILE);
                              return true;
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          askPermission(request);
                      }
                  });

                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  web.requestFocus();
                  if (state != null) web.restoreState(state);
                  if (web.getUrl() == null) web.loadUrl(HOME);
              }

              private boolean isTv() {
                  UiModeManager ui = (UiModeManager) getSystemService(UI_MODE_SERVICE);
                  if (ui != null && ui.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION) return true;
                  return getPackageManager().hasSystemFeature(PackageManager.FEATURE_LEANBACK);
              }

              /* VocaBoard and the student QR server stay inside the app; other websites open in a browser if the device has one */
              private boolean openOutside(String url) {
                  Uri u = Uri.parse(url);
                  String scheme = u.getScheme() == null ? "" : u.getScheme().toLowerCase();
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase();
                  if (scheme.equals("blob") || scheme.equals("data") || scheme.equals("about") || scheme.equals("javascript")) return false;
                  if ((scheme.equals("https") || scheme.equals("http"))
                          && (host.equals(HOST) || host.endsWith("script.google.com") || host.endsWith("googleusercontent.com"))) return false;
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                      return true;
                  } catch (ActivityNotFoundException e) {
                      return !(scheme.equals("https") || scheme.equals("http")); // no browser: show the website here instead
                  }
              }

              /* microphone and webcam tools: only VocaBoard itself may ask */
              private void askPermission(PermissionRequest request) {
                  Uri origin = request.getOrigin();
                  if (origin == null || !HOST.equals(origin.getHost())) {
                      request.deny();
                      return;
                  }
                  ArrayList<String> need = new ArrayList<String>();
                  for (String r : request.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) need.add(android.Manifest.permission.RECORD_AUDIO);
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) need.add(android.Manifest.permission.CAMERA);
                  }
                  if (Build.VERSION.SDK_INT >= 23) {
                      ArrayList<String> ask = new ArrayList<String>();
                      for (String p : need) if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) ask.add(p);
                      if (!ask.isEmpty()) {
                          if (pendingPermission != null) pendingPermission.deny();
                          pendingPermission = request;
                          requestPermissions(ask.toArray(new String[0]), ASK_PERMISSION);
                          return;
                      }
                  }
                  request.grant(request.getResources());
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] permissions, int[] results) {
                  if (code != ASK_PERMISSION || pendingPermission == null) return;
                  boolean ok = results.length > 0;
                  for (int r : results) if (r != PackageManager.PERMISSION_GRANTED) ok = false;
                  if (ok) pendingPermission.grant(pendingPermission.getResources());
                  else pendingPermission.deny();
                  pendingPermission = null;
              }

              @Override
              protected void onActivityResult(int code, int result, Intent data) {
                  if (code == PICK_FILE) {
                      if (fileCallback != null) fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result, data));
                      fileCallback = null;
                      return;
                  }
                  super.onActivityResult(code, result, data);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (web != null) web.saveState(out);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          END_OF_JAVA
